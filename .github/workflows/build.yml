name: build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        run: echo "Starting Aurora Stay build workflow"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "Project root"
          ls
          echo "Server"
          ls server
          echo "Client"
          ls client

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Backend Dependencies
        run: npm install --prefix server

      - name: Run Backend Tests
        run: npm test --prefix server

      - name: Install Frontend Dependencies
        run: npm install --prefix client

      - name: Build React App
        run: npm run build --prefix client

      - name: Post Setup Node
        run: echo "Node setup cleanup complete"

      - name: Post Checkout Code
        run: echo "Repository checkout cleanup complete"

      - name: Complete job
        run: echo "Aurora Stay build workflow finished successfully"
